name: Automated Release (cargo-release)

on:
  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major, or exact version e.g. 0.2.0)'
        required: true
        default: 'patch'
        type: string

permissions:
  contents: write

jobs:
  automated-release:
    name: Automated Workspace Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install ARM toolchain & utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install cargo-release and git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release,git-cliff

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run automated release
        run: |
          cargo release "${{ github.event.inputs.level }}" --execute --no-confirm

      - name: Build firmware matrix for new release
        run: |
          ./scripts/build.sh matrix build

      - name: Extract release version and notes
        id: release_info
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          git-cliff --tag "${LATEST_TAG}" --latest --strip header > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.bin
            dist/*.hex
            dist/*.elf
            dist/SHA256SUMS
