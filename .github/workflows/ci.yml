name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Host Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run clippy linter (wingfc-core)
        run: cargo clippy -p wingfc-core --all-features -- -D warnings

      - name: Run host unit tests across feature matrix
        run: ./scripts/build.sh test

  firmware-build:
    name: Firmware Matrix & Release Build
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM toolchain & objcopy utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils-arm-none-eabi

      - name: Set up Rust toolchain for Cortex-M4F
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Rust dependency cache
        uses: Swatinem/rust-cache@v2

      - name: Verify user aircraft configuration (wingfc.yaml)
        run: ./scripts/build.sh check

      - name: Check all 8 firmware matrix permutations
        run: ./scripts/build.sh matrix check

      - name: Build and package all 8 production binaries
        run: ./scripts/build.sh matrix build

      - name: Upload release build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wingfc-release-binaries
          path: dist/
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: firmware-build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff for changelog extraction
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes for tag
        run: |
          git-cliff --tag "${{ github.ref_name }}" --latest --strip header > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Download release build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wingfc-release-binaries
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.bin
            dist/*.hex
            dist/*.elf
            dist/SHA256SUMS
