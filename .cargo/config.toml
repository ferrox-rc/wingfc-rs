[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52840_xxAA"
rustflags = [
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "target-cpu=cortex-m4",
]

[alias]
fw-check = "check -p wingfc-firmware --target thumbv7em-none-eabihf"
fw-build = "build --release -p wingfc-firmware --target thumbv7em-none-eabihf"
fw-build-crsf = "build --release -p wingfc-firmware --target thumbv7em-none-eabihf --no-default-features --features crsf"
fw-build-ibus = "build --release -p wingfc-firmware --target thumbv7em-none-eabihf --no-default-features --features ibus"
fw-flash = "run --release -p wingfc-firmware --target thumbv7em-none-eabihf"
fw-flash-crsf = "run --release -p wingfc-firmware --target thumbv7em-none-eabihf --no-default-features --features crsf"
fw-flash-ibus = "run --release -p wingfc-firmware --target thumbv7em-none-eabihf --no-default-features --features ibus"
