# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to the WingFC-rs flight controller project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""

# A Tera template to be rendered for each release in the changelog.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}
"""

trim = true
render_always = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false

commit_parsers = [
    { message = "^(?i)(feat|implement|add|complete)", group = "🚀 Features" },
    { message = "^(?i)fix", group = "🐛 Bug Fixes" },
    { message = "^(?i)(doc|readme)", group = "📚 Documentation" },
    { message = "^(?i)perf", group = "⚡ Performance" },
    { message = "^(?i)refactor", group = "🚜 Refactor" },
    { message = "^(?i)style", group = "🎨 Styling" },
    { message = "^(?i)test", group = "🧪 Testing" },
    { message = "^(?i)(chore|ci|bump)", group = "⚙️ Miscellaneous Tasks" },
    { message = ".*", group = "💼 Other Changes" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "phase-.*"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
