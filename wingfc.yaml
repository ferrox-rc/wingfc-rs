# ==============================================================================
# WingFC-rs Aircraft Configuration (wingfc.yaml)
# ==============================================================================
# Target Board Hardware:
#   - 'xiao-sense'       : Standard Seeed Studio XIAO nRF52840 Sense (6-DoF onboard IMU)
#   - 'xiao-sense-plus'  : XIAO nRF52840 Sense Plus (Required for GPS navigation via UARTE1)
board: xiao-sense

# Board Mounting Orientation: default, cw90, cw180, cw270, flip, flip_cw90, flip_cw180, flip_cw270
orientation: default

# Airframe Mixer Topology:
#   - elevon               : Flying wing (Left/Right elevons + optional rudder)
#   - elevon_diff_thrust   : Flying wing with twin differential thrust motors
#   - single_aileron_t_tail: Conventional airplane (S1: Ail, S2: Elev, S4: Rudder)
#   - dual_aileron_t_tail  : Dual aileron airplane (S1: L Ail, S2: Elev, S4: Rudder, S5: R Ail)
#   - single_aileron_v_tail: V-tail aircraft (S1: Ail, S2: R V-Tail, S4: L V-Tail)
#   - dual_aileron_v_tail  : Dual aileron V-tail (S1: L Ail, S2: R V-Tail, S4: L V-Tail, S5: R Ail)
airframe: elevon

receiver:
  protocol: ibus            # crsf | ibus
  channel_order: AETR       # Default: Aileron/Roll=1, Elevator/Pitch=2, Throttle=3, Rudder/Yaw=4
  arm_channel: 5            # CH5 / AUX1 (Arm switch)
  mode_channel: 6           # CH6 / AUX2 (Flight mode switch)
  failsafe_timeout_ms: 500

# Flight Mode Activation Ranges (channels 1-16, pulse range in microseconds)
modes:
  - mode: angle             # Self-leveling attitude stabilization
    channel: 6
    range: [1300, 2100]
  - mode: acro              # Full rate manual / acrobatic mode
    channel: 6
    range: [900, 1300]

actuators:
  servo_pwm_hz: 400          # 50 Hz (analog servos) up to 400 Hz (digital servos)
  motor_protocol: pwm       # pwm (analog ESC) | dshot (digital DShot stream)
  motor_pwm_hz: 400         # 50..400 Hz (multirotor ESCs: 400Hz, basic airplane ESCs: 50Hz)
  differential_thrust: 0.15 # Twin-motor yaw authority fraction (for elevon_diff_thrust)
  # Optional per-servo subtrim/reversals (defaults: 1000..2000 us, subtrim 0, reversed false)
  servos:
    servo1: { reversed: false, subtrim_us: 0 }
    servo2: { reversed: false, subtrim_us: 0 }

# External Sensor Suite
sensors:
  barometer: none           # dps310 | bmp280 | none
  compass: none             # qmc5883l | hmc5883l | none
  declination_deg: 0.0      # Local magnetic declination in degrees (+ East, - West)
  gps: false                # true | false (autonomous RTH, requires board: xiao-sense-plus)

tuning:
  acro_rates: { roll_dps: 600.0, pitch_dps: 200.0, yaw_dps: 100.0 }
  angle_limits: { max_roll_deg: 60.0, max_pitch_deg: 45.0, p_gain: 4.0 }
  rate_pid: { kp: 1.0, ki: 0.1, kd: 0.01, kff: 0.04, max_integral: 0.40 }
  filters: { gyro_lpf_hz: 90.0, dterm_lpf_hz: 40.0, feedforward_lpf_hz: 45.0 }
  vqf: { tau_acc: 3.5, tau_mag: 9.0 }

safety:
  arm_switch_threshold_us: 1800
  throttle_zero_threshold_us: 1050
  hard_deck_agl_m: 15.0     # Emergency pull-up floor in meters AGL
  max_ceiling_agl_m: 120.0  # Statutory altitude ceiling limit (120m / 400ft AGL)
