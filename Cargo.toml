[workspace]
resolver = "2"
members = [
    "crates/wingfc-core",
    "crates/wingfc-firmware",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["Bryan Souza <brybryflys@gmail.com>"]
license = "MIT"
repository = "https://github.com/BryanSouza91/wingfc-rs"
homepage = "https://github.com/BryanSouza91/wingfc-rs"

[workspace.dependencies]
wingfc-core = { path = "crates/wingfc-core", version = "0.3.1", default-features = false }

[workspace.metadata.release]
shared-version = true
consolidate-commits = true
tag = true
tag-name = "v{{version}}"
tag-message = "Release v{{version}}"
pre-release-commit-message = "chore(release): Release v{{version}}"
publish = false
push = true
pre-release-hook = ["git-cliff", "--tag", "v{{version}}", "-o", "CHANGELOG.md"]

[profile.dev]
opt-level = 1
debug = 2

[profile.dev.package."*"]
opt-level = 3


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"
