[package]
name = "wingfc-firmware"
version = "0.1.0"
edition = "2021"
authors = ["Bryan Souza"]
license = "MIT"
description = "Embedded flight controller firmware for Seeed Studio XIAO nRF52840 Sense"

[features]
default = ["crsf"]
crsf = []
ibus = []
dshot = []

[dependencies]
wingfc-core = { path = "../wingfc-core", features = ["defmt-03"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.4", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.3", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote"] }
embassy-sync = { version = "0.6", features = ["defmt"] }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "0.3", features = ["print-defmt"] }
libm = "0.2"
