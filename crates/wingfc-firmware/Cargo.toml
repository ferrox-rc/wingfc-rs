[package]
name = "wingfc-firmware"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Embedded flight controller firmware for Seeed Studio XIAO nRF52840 Sense"
publish = false

[features]
default = ["crsf"]
crsf = []
ibus = []
dshot = []
baro = ["wingfc-core/baro"]
compass = ["wingfc-core/compass"]
gps = ["wingfc-core/gps"]
nav = ["wingfc-core/nav", "baro", "compass", "gps"]

[dependencies]
wingfc-core = { workspace = true, features = ["defmt-03"] }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52840", "time-driver-rtc1", "gpiote", "nfc-pins-as-gpio"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
static_cell = "2.1"
defmt = "1.1"
defmt-rtt = "1.3"
panic-probe = { version = "1.0", features = ["print-defmt"] }
libm = "0.2"
nrf-pac = { version = "0.4", features = ["nrf52840"] }
